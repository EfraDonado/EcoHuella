<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Únete a EcoHuella - Cuidemos el Planeta Juntos</title>
  
  <style>
    :root {
      --color-primary: #2e8b57; 
      --color-secondary: #00b894; 
      --color-green-light: #e6f7e6; 
      --color-text: #222;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(270deg, var(--color-green-light), #c8e6c9, var(--color-green-light));
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      animation: fadeIn 1s ease-in;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 450px;
      width: 90%;
      text-align: center;
      animation: slideUp 0.8s ease-out 0.2s both;
      overflow: hidden;
      position: relative; 
    }

    #success-message {
      background: var(--color-green-light);
      color: var(--color-primary);
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      display: none; 
      animation: fadeIn 0.5s ease-in; 
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }


    h1 {
      color: var(--color-primary);
      font-size: 2.5rem;
      margin-bottom: 10px;
      animation: pulse 1.5s ease-in-out 0.4s both;
    }

    p.subtitle {
      color: var(--color-secondary);
      font-size: 1.1rem;
      margin-bottom: 25px;
      animation: fadeInUp 1s ease-in 0.6s both;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid var(--color-green-light);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      animation: fadeIn 1s ease-in 0.8s both;
    }

    input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 10px rgba(46, 139, 87, 0.2);
      transform: scale(1.02);
    }

    button.btn-main {
      background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
      transition: transform 0.3s, box-shadow 0.3s;
      animation: bounceIn 1s ease-in 1s both;
      margin-top: 15px;
    }

    button.btn-main.is-loading {
      cursor: wait;
      opacity: 0.75;
    }

    button.btn-main:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 8px 20px rgba(46, 139, 87, 0.3);
    }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      p.subtitle { font-size: 1rem; }
      .container { padding: 25px; }
    }
  </style>
  
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('authForm');
      const toggleBtn = document.getElementById('toggleModo');
      const nombreInput = document.getElementById('nombre');
      const nombreGroup = document.getElementById('grupoNombre');
      const correoInput = document.getElementById('correo');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const successMessage = document.getElementById('success-message');
      const titulo = document.getElementById('tituloFormulario');
      const subtitulo = document.getElementById('subtituloFormulario');

      let modo = 'registro';

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        toggleBtn.disabled = isLoading;
        submitBtn.classList.toggle('is-loading', isLoading);
        if (isLoading) {
          submitBtn.textContent = modo === 'registro' ? 'Registrando...' : 'Ingresando...';
        } else {
          submitBtn.textContent = modo === 'registro' ? 'Registrarme' : 'Iniciar sesión';
        }
      }

      function actualizarVista() {
        setLoading(false);
        if (modo === 'registro') {
          titulo.textContent = '¡Únete a EcoHuella!';
          subtitulo.textContent = '¡Contribuye al cuidado del planeta y reduce tu huella ecológica de manera simple y efectiva!';
          nombreGroup.style.display = 'block';
          nombreInput.required = true;
          submitBtn.textContent = 'Registrarme';
          toggleBtn.textContent = 'Ya tengo cuenta, iniciar sesión';
        } else {
          titulo.textContent = '¡Hola de nuevo!';
          subtitulo.textContent = 'Ingresa con tu correo para seguir colaborando con la comunidad.';
          nombreGroup.style.display = 'none';
          nombreInput.required = false;
          submitBtn.textContent = 'Iniciar sesión';
          toggleBtn.textContent = 'Quiero crear una cuenta nueva';
        }
        successMessage.style.display = 'none';
        form.reset();
        correoInput.focus();
      }

      async function enviarFormulario(event) {
        event.preventDefault();

        const nombre = nombreInput.value.trim();
        const correo = correoInput.value.trim();
        const password = passwordInput.value.trim();

        successMessage.style.display = 'none';
        successMessage.style.color = 'var(--color-primary)';

        try {
          setLoading(true);
          successMessage.textContent = modo === 'registro'
            ? 'Registrando tu cuenta, por favor espera...'
            : 'Verificando tus datos, un momento...';
          successMessage.style.display = 'block';

          const url = modo === 'registro'
            ? 'https://ecohuella.onrender.com/api/users'
            : 'https://ecohuella.onrender.com/api/login';
          const payload = modo === 'registro'
            ? { name: nombre, email: correo, password }
            : { email: correo, password };

          if (modo === 'registro' && !nombre) {
            throw new Error('Escribe tu nombre para registrarte.');
          }

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'No se pudo completar la solicitud.');
          }

          const nombreGuardado = data.name || nombre;
          const correoGuardado = data.email || correo;
          sessionStorage.setItem('ecoUserName', nombreGuardado);
          sessionStorage.setItem('ecoUserEmail', correoGuardado);

          if (modo === 'registro') {
            successMessage.textContent = `¡Registro completado! Bienvenido, ${nombreGuardado}.`;
          } else {
            successMessage.textContent = `¡Hola ${nombreGuardado}! Tu inicio de sesión fue correcto.`;
            setTimeout(() => {
              window.location.href = '../index.html';
            }, 1200);
          }
          successMessage.style.display = 'block';
          form.reset();
        } catch (error) {
          successMessage.textContent = error.message || 'Ocurrió un error.';
          successMessage.style.color = '#c0392b';
          successMessage.style.display = 'block';
        }
        finally {
          setLoading(false);
        }
      }

      toggleBtn.addEventListener('click', () => {
        modo = modo === 'registro' ? 'login' : 'registro';
        actualizarVista();
      });

      form.addEventListener('submit', enviarFormulario);
      actualizarVista();
    });
  </script>
</head>
<body>
  <div class="container">
    <h1 id="tituloFormulario">¡Únete a EcoHuella!</h1>
    <p id="subtituloFormulario" class="subtitle">¡Contribuye al cuidado del planeta y reduce tu huella ecológica de manera simple y efectiva!</p>
    <form id="authForm">
      <div id="grupoNombre">
        <input id="nombre" type="text" placeholder="Tu nombre" /><br><br>
      </div>
      <input id="correo" type="email" placeholder="Correo electrónico" required /><br><br>
      <input id="password" type="password" placeholder="Contraseña" required /><br><br>
      <button id="submitBtn" type="submit" class="btn-main">Registrarme</button>
    </form>
    <button id="toggleModo" type="button" class="btn-main" style="background: transparent; color: var(--color-primary); border: 2px solid var(--color-primary); margin-top: 12px;">
      Ya tengo cuenta, iniciar sesión
    </button>
    <div id="success-message"></div>
  </div>
</body>
</html>
