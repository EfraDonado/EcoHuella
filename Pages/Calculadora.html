<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Huella Ecológica</title>
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../script.js"></script>
  <script defer>
    function calcularHuella(e) {
      e.preventDefault();

      const energia = parseInt(document.getElementById("energia").value);
      const transporte = parseInt(document.getElementById("transporte").value);
      const residuos = parseInt(document.getElementById("residuos").value);

      const resultado = energia + transporte + residuos;
      const mensaje =
        resultado <= 5
          ? "🌿 ¡Excelente! Tu huella es muy baja, sigue así."
          : resultado <= 8
          ? "🌱 Bien, pero puedes mejorar tus hábitos."
          : "🔥 Tu huella es alta, ¡es momento de cambiar!";
      
      document.getElementById("resultado").textContent = mensaje;
    }
  </script>
</head>
<body>
  <section style="text-align:center; padding:60px;">
    <h1>Calcula tu Huella Ecológica 🪴</h1>
    <form onsubmit="calcularHuella(event)">
      <label>¿Cuánta energía consumes al día? (1=baja, 5=alta)</label><br>
      <input id="energia" type="number" min="1" max="5" required><br><br>

      <label>¿Cuánto usas transporte motorizado? (1=poco, 5=mucho)</label><br>
      <input id="transporte" type="number" min="1" max="5" required><br><br>

      <label>¿Cuánta basura generas? (1=poca, 5=mucha)</label><br>
      <input id="residuos" type="number" min="1" max="5" required><br><br>

      <button type="submit" class="btn-main">Calcular</button>
    </form>

    <h3 id="resultado" style="margin-top:30px;"></h3>

    <a href="../index.html" class="btn-login">Volver al inicio</a>
  </section>
</body>
</html>
